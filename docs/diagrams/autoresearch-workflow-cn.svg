  <text x="60" y="140" fill="#F7FAFC" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">AutoResearch</text>
  <text x="60" y="188" fill="#D7E3ED" font-family="Arial, Helvetica, sans-serif" font-size="27">From Idea to Paper-Ready Evidence</text>
  <text x="60" y="226" fill="#47C9E7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">Insight In, Hallucination Out.</text>

